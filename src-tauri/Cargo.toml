[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
mtp-rs = "0.33"
tokio = { version = "1.53", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
globset = "0.4.20"
xattr = "1.6.1"
libc = "0.2.190"

[dev-dependencies]
mtp-rs = { version = "0.33", features = ["virtual-device"] }
